<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Princess Day</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf3ea;--ink:#4a1d2b;--rose:#b83a5a;--gold:#a87b2c;--card:#fffaf4;--line:#e3cfb9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1a1d;--ink:#f6e7da;--rose:#e0728f;--gold:#d4a24c;--card:#392427;--line:#5a3d40}}
:root[data-theme="dark"]{--bg:#2a1a1d;--ink:#f6e7da;--rose:#e0728f;--gold:#d4a24c;--card:#392427;--line:#5a3d40}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:Jost,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.serif{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600}
.fall{position:fixed;top:-30px;width:11px;height:15px;border-radius:0 100% 0 100%;opacity:.85;pointer-events:none;z-index:1;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(500deg)}}
.page{position:fixed;inset:0;padding:calc(env(safe-area-inset-top,0px) + 36px) 20px calc(env(safe-area-inset-bottom,0px) + 104px);overflow-y:auto;display:flex;flex-direction:column;align-items:center;opacity:0;visibility:hidden;transform:translateY(24px);transition:opacity .6s,transform .6s,visibility .6s;z-index:2}
.page.active{opacity:1;visibility:visible;transform:none}
.page.before{transform:translateY(-24px)}
h1,h2{margin:.2em 0;text-align:center;color:var(--rose);font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600}
h1{font-size:2.5rem;line-height:1.1;min-height:2.4em}
h2{font-size:2.2rem}
.hint{margin:6px 0;opacity:.8;text-align:center;font-size:.95rem}
.crown{width:60px;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.gift{position:relative;width:160px;height:160px;margin:26px auto 10px;cursor:pointer;animation:wob 2.4s ease-in-out infinite;border:0;background:none;padding:0}
.gift.open{animation:none}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.box{position:absolute;bottom:0;left:15px;width:130px;height:95px;border-radius:4px;background:var(--rose);box-shadow:0 12px 24px rgba(74,29,43,.25)}
.box::before,.lid::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:18px;margin-left:-9px;background:var(--gold)}
.lid{position:absolute;bottom:90px;left:5px;width:150px;height:40px;border-radius:4px;background:#9c2f4b;transition:transform .9s cubic-bezier(.3,1.4,.5,1),opacity .9s}
.open .lid{transform:translateY(-80px) rotate(-20deg);opacity:0}
.burst{position:absolute;left:50%;top:40%;width:8px;height:8px;border-radius:50%;background:var(--gold);animation:bu 1.2s ease-out forwards;pointer-events:none}
@keyframes bu{to{transform:translate(var(--x),var(--y)) scale(1.4);opacity:0}}
#wl{width:100%;max-width:460px;display:flex;flex-direction:column;gap:12px}
.wish{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--rose);border-radius:4px;padding:14px 16px;opacity:0;transform:translateY(26px);transition:opacity .7s,transform .7s;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:1.3rem;line-height:1.35;box-shadow:0 8px 20px rgba(74,29,43,.08)}
.wish.in{opacity:1;transform:none}
.wish.mem{border-left-color:var(--gold)}
.song,.letter{max-width:460px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:20px;text-align:center;box-shadow:0 8px 20px rgba(74,29,43,.08)}
.song{margin:14px 0}
.song .t{font-size:1.9rem;color:var(--rose)}
.letter{text-align:left;line-height:1.7;margin-top:6px}
.sign{margin-top:14px;text-align:right;font-size:1.7rem;color:var(--rose)}
#lab{margin-top:14px;min-height:4em;text-align:center;max-width:380px}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-block;border:1px solid var(--rose);border-radius:4px;padding:11px 20px;font:500 .85rem Jost,sans-serif;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:#fff;background:var(--rose);cursor:pointer}
.btn.alt{background:none;color:var(--ink);border-color:var(--gold)}
.btn:disabled{opacity:.4;cursor:default}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 14px);background:var(--bg)}
.dots{display:flex;gap:8px}
.dots b{width:8px;height:8px;border-radius:50%;background:var(--gold);opacity:.35;transition:.3s}
.dots b.on{opacity:1;background:var(--rose);transform:scale(1.3)}
.made{font-size:.75rem;opacity:.7}
#bqs{width:100%;display:flex;justify-content:center}
.bq{width:280px;max-width:90%;background:none;border:0;cursor:pointer;padding:0}
.bq svg{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 14px rgba(74,29,43,.25))}
.fl>g{transform-box:fill-box;transform-origin:center;transform:scale(0)}
.bloom .fl>g{animation:bl .9s cubic-bezier(.3,1.5,.5,1) forwards;animation-delay:var(--d)}
@keyframes bl{to{transform:scale(1)}}
#fx{position:fixed;inset:0;z-index:9;pointer-events:none}
.heart{position:fixed;z-index:10;pointer-events:none;animation:hu 1.6s ease-out forwards}
@keyframes hu{to{transform:translate(var(--x),-130px) scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}.fl>g{transform:none}.wish{opacity:1;transform:none}}
body{background:radial-gradient(circle at 20% 10%,rgba(232,160,180,.35),transparent 45%),radial-gradient(circle at 85% 90%,rgba(212,162,76,.3),transparent 45%),var(--bg)}
h1{background:linear-gradient(100deg,var(--rose) 20%,var(--gold) 50%,var(--rose) 80%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
@keyframes sh{to{background-position:200% center}}
.wish,.song,.letter{backdrop-filter:blur(6px);border-radius:14px}
.wish{border-left-width:4px}
.crown{filter:drop-shadow(0 0 12px rgba(212,162,76,.8))}
.gift{filter:drop-shadow(0 0 22px rgba(184,58,90,.45))}
.tw{position:fixed;width:4px;height:4px;border-radius:50%;background:var(--gold);z-index:1;pointer-events:none;box-shadow:0 0 8px var(--gold);animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.4)}}
#mus{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:11;width:40px;height:40px;border-radius:50%;border:1px solid var(--gold);background:var(--card);color:var(--rose);font-size:1.2rem;cursor:pointer}
#mus.off{opacity:.5;text-decoration:line-through}
#lab{min-height:4em;margin-top:14px;text-align:center;max-width:380px}
@media (prefers-reduced-motion:reduce){h1{animation:none}.tw{animation:none;opacity:.6}}
</style>
</head>
<body>

<section class="page active" id="p1">
  <svg class="crown" viewBox="0 0 64 42" aria-hidden="true"><path d="M4 36 8 10l14 14L32 4l10 20 14-14 4 26z" fill="var(--gold)"/><rect x="4" y="34" width="56" height="6" rx="2" fill="var(--gold)"/></svg>
  <button class="gift" id="gift" aria-label="Open the gift"><div class="box"></div><div class="lid"></div></button>
  <p class="hint" id="h1">Tap the gift to open your surprise</p>
  <h1 id="title"></h1>
</section>

<section class="page" id="p2">
  <h2>Wishes for My Princess</h2>
  <div id="wl"></div>
</section>

<section class="page" id="p3">
  <h2>For You</h2>
  <div id="bqs"></div>
  <div id="bqmsg" class="hint">Tap the bouquet</div>
  <div class="letter"><div id="msg"></div><div class="sign serif" id="sign"></div></div>
  <div class="row"><button class="btn" id="dec">Royal Decree</button><button class="btn" id="cel">Celebrate</button><button class="btn alt" id="rep">Watch again</button></div>
  <div id="lab"></div>
</section>

<button id="mus" aria-label="Toggle music">&#9835;</button>

<canvas id="fx"></canvas>

<script>
/* ===== YAHAN BADLO ===== */
const CONFIG = {
  name: "My Princess",
  from: "Sohail Abbas",
  wishes: [
    "May your life always be full of happiness, and may your heart always find peace.",
    "You are my dearest friend. Even the most boring day turns special with you.",
    "May all your dreams come true and success follow you in everything you do.",
    "Stay healthy, stay strong and keep smiling. Your smile is your crown.",
    "No matter what happens, I will always be by your side. A true friend, forever."
  ],
  memory: "And yes, our crazy memories and that laughter of yours that never stops are the best things in my life.",
  message: "Meri pyari dost, tum meri life ki un khoobsurat cheezon mein se ho jin ka main hamesha shukar guzar rehta hoon. Tumhari hansi, tumhari sachchai aur tumhara pyar bhara dil, sab kuch bohat special hai. Aaj tumhara din hai, toh bilkul Princess ki tarah enjoy karo. Main hamesha tumhare saath hoon, aaj, kal aur hamesha. Princess Day Mubarak ho!"
};
/* ======================= */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const N = CONFIG.name;
$("#made").textContent = N + "Made with love, just for " + N;
$("#msg").textContent = CONFIG.message;
$("#sign").textContent = "Dher saari dua aur dosti ke saath, " + CONFIG.from;
$("#wl").innerHTML = CONFIG.wishes.concat(CONFIG.memory).map((w, i, a) => `<div class="wish${i === a.length - 1 ? " mem" : ""}">${w}</div>`).join("");
$("#dots").innerHTML = "<b></b><b></b><b></b>";

/* falling petals */
function petal() {
  const e = document.createElement("div"), c = ["#e8a0b4", "#f4c7d3", "#d46a8a", "#e9c46a"][Math.random() * 4 | 0];
  e.className = "fall";
  e.style.cssText = `left:${Math.random()*100}%;background:${c};animation-duration:${7+Math.random()*6}s;--dx:${Math.random()*80-40}px`;
  document.body.appendChild(e); e.onanimationend = () => e.remove();
}
if (!reduce) setInterval(petal, 1100);

/* bouquet */
const rose = (g, d) => `<g><circle r="17" fill="${d}"/>` + [0,1,2,3,4].map(i => `<ellipse cy="-8" rx="9.5" ry="11" fill="url(#${g})" stroke="${d}" stroke-width=".7" transform="rotate(${i*72+10})"/>`).join("") +
  `<circle r="9" fill="url(#${g})" stroke="${d}" stroke-width=".7"/><path d="M-5 1C-5-6 5-6 5 0 5 5-2 6-3 2" fill="none" stroke="${d}" stroke-width="1"/><circle r="2.5" fill="${d}"/></g>`;
const sun = () => `<g>` + [...Array(24)].map((_, i) => `<ellipse cy="-20" rx="4.5" ry="11" fill="${i % 2 ? "#f2a900" : "url(#sf)"}" transform="rotate(${i*15})"/>`).join("") +
  `<circle r="12" fill="#5a3416"/><circle r="8" fill="#3d230d"/>` + [...Array(10)].map((_, i) => `<circle cx="${(Math.cos(i*.63)*(i%2?5:8)).toFixed(1)}" cy="${(Math.sin(i*.63)*(i%2?5:8)).toFixed(1)}" r="1" fill="#8a5a2b"/>`).join("") + `</g>`;
const tulip = () => `<g><path d="M-11 10C-16-6-7-16 0-24 7-16 16-6 11 10Z" fill="#e0587c"/><path d="M-11 10C-14-4-8-12-2-16 0-6 0 2 1 10Q-5 13-11 10Z" fill="url(#lt)" stroke="#b83a5a" stroke-width=".6"/><path d="M11 10C14-4 8-12 2-16 0-6 0 2-1 10Q5 13 11 10Z" fill="url(#lt)" stroke="#b83a5a" stroke-width=".6"/></g>`;
const heads = [[sun, 100, 46, .85], [() => rose("rr", "#7d1a34"), 60, 74, 1], [() => rose("rp", "#b8456d"), 140, 74, 1], [() => rose("rr", "#7d1a34"), 100, 102, .95],
  [tulip, 30, 106, 1], [tulip, 170, 106, 1], [() => rose("rp", "#b8456d"), 64, 126, .85], [() => rose("rr", "#7d1a34"), 136, 126, .85]];
const baby = [[18, 78], [182, 78], [78, 30], [122, 28], [44, 46], [156, 46]];
$("#bqs").innerHTML = `<button class="bq" aria-label="Bouquet"><svg viewBox="0 0 200 260">
<defs><radialGradient id="rr"><stop offset="0" stop-color="#e0526f"/><stop offset="1" stop-color="#8e1f3c"/></radialGradient>
<radialGradient id="rp"><stop offset="0" stop-color="#f8b4c6"/><stop offset="1" stop-color="#cf5b82"/></radialGradient>
<linearGradient id="sf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd84a"/><stop offset="1" stop-color="#f0a800"/></linearGradient>
<linearGradient id="lt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb3c8"/><stop offset="1" stop-color="#d6456f"/></linearGradient>
<linearGradient id="lg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3f6f45"/><stop offset="1" stop-color="#86b280"/></linearGradient></defs>
${heads.map(h => `<path d="M100 195Q${(100+h[1])/2} ${(195+h[2])/2+10} ${h[1]} ${h[2]}" stroke="#4f7a4f" stroke-width="2.2" fill="none"/>`).join("")}
${baby.map(b => `<path d="M100 195L${b[0]} ${b[1]}" stroke="#6f8f72" stroke-width="1" fill="none"/>` + [[0,0],[5,4],[-5,4],[3,-5],[-4,-4]].map(o => `<circle cx="${b[0]+o[0]}" cy="${b[1]+o[1]}" r="2.6" fill="#fffaf0"/>`).join("")).join("")}
${[-75, -48, -22, 22, 48, 75].map(a => `<path d="M0 0C-14-20-8-46 0-62 8-46 14-20 0 0Z" fill="url(#lg)" transform="translate(100 168) rotate(${a})"/>`).join("")}
${heads.map((h, i) => `<g class="fl" transform="translate(${h[1]} ${h[2]}) scale(${h[3]})"><g style="--d:${i*.13}s">${h[0]()}</g></g>`).join("")}
<polygon points="38,152 162,152 120,252 80,252" fill="#d6b384"/><polygon points="38,152 100,162 80,252" fill="#c39d6c"/><polygon points="162,152 100,162 120,252" fill="#e2c597"/>
<path d="M64 190H136L131 204H69Z" fill="#8e1f3c"/>
<ellipse cx="86" cy="197" rx="14" ry="8" fill="#a82a4b" transform="rotate(-20 86 197)"/><ellipse cx="114" cy="197" rx="14" ry="8" fill="#a82a4b" transform="rotate(20 114 197)"/>
<path d="M98 200L88 228 96 224 100 232ZM102 200L112 228 104 224 100 232Z" fill="#8e1f3c"/><circle cx="100" cy="198" r="5" fill="#7d1a34"/>
</svg></button>`;
$(".bq").onclick = e => {
  $("#bqmsg").textContent = "This whole bouquet is for my dearest friend. Happy Princess Day!";
  hearts(e.clientX, e.clientY, 6);
};

/* hearts */
function hearts(x, y, n) {
  for (let i = 0; i < n; i++) {
    const h = document.createElement("div");
    h.className = "heart"; h.textContent = ["❤️", "💗", "🌹"][i % 3];
    h.style.cssText = `left:${x}px;top:${y}px;--x:${Math.random()*120-60}px;animation-delay:${i*.07}s`;
    document.body.appendChild(h); h.onanimationend = () => h.remove();
  }
}

/* confetti aur fireworks */
const cv = $("#fx"), cx = cv.getContext("2d"); let P = [], on = false;
const fit = () => { cv.width = innerWidth; cv.height = innerHeight; }; fit(); addEventListener("resize", fit);
const COLS = ["#b83a5a", "#d4a24c", "#f4c7d3", "#6f8f72", "#fff4e6"];
function kick() { if (!on) { on = true; requestAnimationFrame(loop); } }
function burst(x, y, n) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, s = 2 + Math.random() * 5;
    P.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: 60 + Math.random() * 30, c: COLS[i % 5], g: .06, r: 2.5}); }
  kick();
}
function confetti() {
  for (let i = 0; i < 110; i++) P.push({x: Math.random() * cv.width, y: -10, vx: Math.random() * 2 - 1, vy: 2 + Math.random() * 3, l: 220, c: COLS[i % 5], g: .02, r: 4, sq: 1});
  kick();
}
function loop() {
  cx.clearRect(0, 0, cv.width, cv.height);
  P.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.l--; cx.globalAlpha = Math.min(1, p.l / 30); cx.fillStyle = p.c;
    p.sq ? cx.fillRect(p.x, p.y, p.r * 1.6, p.r) : (cx.beginPath(), cx.arc(p.x, p.y, p.r, 0, 6.283), cx.fill()); });
  P = P.filter(p => p.l > 0 && p.y < cv.height + 20);
  P.length ? requestAnimationFrame(loop) : (on = false, cx.clearRect(0, 0, cv.width, cv.height));
}

let tt; function type(el, txt) { clearInterval(tt); el.textContent = ""; let i = 0; tt = setInterval(() => { el.textContent = txt.slice(0, ++i); if (i >= txt.length) clearInterval(tt); }, 70); }

/* navigation */
let cur = 0, opened = false, wt = [];
function go(i) {
  if (i < 0 || i > 2 || (i > 0 && !opened)) return;
  cur = i;
  $$(".page").forEach((p, k) => { p.classList.toggle("active", k === i); p.classList.toggle("before", k < i); });
  $$(".dots b").forEach((d, k) => d.classList.toggle("on", k === i));
  $("#next").disabled = i === 2 || (i === 0 && !opened);
  if (i === 1) { wt.forEach(clearTimeout); wt = $$(".wish").map((w, k) => setTimeout(() => w.classList.add("in"), 500 + k * 750)); }
  if (i === 2) { const b = $("#p3"); b.classList.remove("bloom"); void b.offsetWidth; b.classList.add("bloom"); }
}
$("#next").onclick = () => go(cur + 1);
let sx = 0; addEventListener("touchstart", e => sx = e.touches[0].clientX, {passive: true});
addEventListener("touchend", e => { const d = e.changedTouches[0].clientX - sx; if (Math.abs(d) > 60) go(cur + (d < 0 ? 1 : -1)); });

$("#gift").onclick = () => {
  if (opened) return; opened = true;
  $("#gift").classList.add("open"); $("#h1").textContent = "Your surprise is ready! Tap Next";
  for (let i = 0; i < 18; i++) { const s = document.createElement("span"); s.className = "burst";
    const a = i / 18 * 6.283, r = 80 + Math.random() * 70; s.style.cssText = `--x:${Math.cos(a)*r}px;--y:${Math.sin(a)*r-40}px`;
    $("#gift").appendChild(s); s.onanimationend = () => s.remove(); }
  type($("#title"), "Happy Princess Day, " + N + "!"); $("#next").disabled = false;
};

/* royal decree */
const lab = $("#lab");
const FAR = ["Decree: Today, tea and pizza are on me. The Princess decides everything!", "Decree: Whoever annoys the Princess does 100 sit-ups!", "Decree: Whatever you say today is right (for today only).", "Decree: The whole kingdom bows to the Princess's smile!", "Decree: Everyone must keep the Princess in a good mood today!"];
let fi = 0; $("#dec").onclick = () => { lab.textContent = FAR[fi++ % FAR.length]; confetti(); };
function rain() { for (let i = 0; i < 30; i++) setTimeout(petal, i * 60); }
$(".crown").onclick = rain;
addEventListener("pointerdown", e => hearts(e.clientX, e.clientY, 1));

$("#cel").onclick = () => {
  confetti(); [0, 400, 800, 1200, 1600].forEach(t => setTimeout(() => burst(innerWidth * (.15 + Math.random() * .7), innerHeight * (.15 + Math.random() * .35), 60), t));
  hearts(innerWidth / 2, innerHeight * .7, 12);
};
$("#rep").onclick = () => {
  opened = false; $("#gift").classList.remove("open"); $("#h1").textContent = "Tap the gift to open your surprise";
  $("#title").textContent = ""; clearInterval(tt); wt.forEach(clearTimeout); lab.textContent = "";
  $$(".wish").forEach(w => w.classList.remove("in")); go(0);
};
/* sparkles + background music */
for (let i = 0; i < 26; i++) { const t = document.createElement("i"); t.className = "tw"; t.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*3}s`; document.body.appendChild(t); }
const bgm = $("#bgm"), mus = $("#mus"); bgm.volume = .6; let muted = false;
const play = () => { if (muted || !bgm.paused) return; bgm.muted = false; const p = bgm.play(); if (p) p.catch(() => { bgm.load(); }); };
["pointerdown", "touchend", "click", "keydown"].forEach(ev => addEventListener(ev, play, true));
bgm.addEventListener("canplaythrough", () => { if (!muted) play(); });
bgm.load();
mus.onclick = e => { e.stopPropagation(); muted = !muted; mus.classList.toggle("off", muted); muted ? bgm.pause() : play(); };
go(0);
</script>
</body>
</html>
